<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Taste of Ukraine :: Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Taste of Ukraine to share feedback, ask questions, or suggest traditional Ukrainian dishes.">
  <link rel="stylesheet" href="ukraine.css">
</head>

<body>
  <div id="wrapper">

    <header>
      <h1>Taste of Ukraine</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="culture.html">Culture</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main>

      <section class="intro-card">
        <h2>Contact / Feedback</h2>
        <p>
          Have a question, comment, or Ukrainian dish suggestion? Fill out the form below.
        </p>
      </section>

      <section class="recipe-card">
        <div class="recipe-text">
          <h3>Share Your Feedback</h3>

          <form method="post" action="#">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="favorite-dish">Favorite Ukrainian Dish:</label>
            <input type="text" id="favorite-dish" name="favorite-dish">

            <label for="comments">Comments or Suggestions:</label>
            <textarea id="comments" name="comments" rows="5" required></textarea>

            <input type="submit" value="Submit">
          </form>
        </div>

        <img src="family-dinner.jpg" alt="Family dinner with Ukrainian food">
      </section>

    </main>

    <footer>
      Copyright &copy; 2026 Taste of Ukraine
      <a href="mailto:ltukhlyn@asu.edu">Leo Tukhlynovych</a>
    </footer>

  </div>
</body>
</html>
